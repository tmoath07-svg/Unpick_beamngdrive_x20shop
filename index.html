<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>معاذ. K20SHOP x</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:#fff;color:#000;
    font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;
    padding:max(env(safe-area-inset-top),24px) 20px max(env(safe-area-inset-bottom),24px);
    line-height:1.6;
  }
  header{width:100%;text-align:center;padding:48px 0 56px}
  header h1{font-size:clamp(28px,6vw,44px);font-weight:700;letter-spacing:.5px}
  main{width:100%;max-width:680px;flex:1;display:flex;flex-direction:column;justify-content:center;gap:20px;padding-bottom:32px}
  .intro{text-align:center;margin-bottom:12px}
  .intro h2{font-size:clamp(24px,5vw,34px);font-weight:700}
  .intro p{font-size:clamp(15px,3.4vw,18px);color:#333;margin-top:6px}

  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid #000;border-radius:2px;padding:10px 12px;min-height:64px}
  .row .fname{display:flex;align-items:center;gap:10px;min-width:0;flex:1;font-size:15px;color:#000}
  .row .fname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row svg{flex:none}

  button{font-family:inherit;font-size:16px;font-weight:700;border:0;border-radius:2px;cursor:pointer;background:#000;color:#fff;-webkit-appearance:none;appearance:none;touch-action:manipulation}
  .small{padding:12px 20px;flex:none}
  .big{width:100%;padding:16px;min-height:54px}
  button:disabled{background:#ddd;color:#888;cursor:not-allowed}
  button:focus-visible,input:focus-visible{outline:2px solid #000;outline-offset:2px}

  .card{border:1px solid #000;border-radius:2px;padding:16px 18px}
  .card .top{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .state{display:flex;align-items:center;gap:10px;font-size:14px}
  .info{text-align:left;direction:ltr;min-width:0}
  .info .n{font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px}
  .info .s{font-size:14px;color:#333}
  .card hr{border:0;border-top:1px solid #ccc;margin:14px 0}
  #msg{text-align:center;font-size:14px;color:#222;min-height:22px;word-break:break-word}
  #detail{text-align:center;font-size:12px;color:#777;margin-top:6px;word-break:break-word;direction:ltr}
  #list{list-style:none;margin-top:12px;border-top:1px solid #ccc;padding-top:10px;max-height:170px;overflow:auto;direction:ltr;text-align:left;font-size:13px;color:#222}
  #list li{padding:2px 0;word-break:break-all}
  #list li.more{color:#777}

  .dl{display:flex;align-items:center;justify-content:center;gap:10px}
  footer{width:100%;max-width:680px;text-align:center;font-size:13px;color:#777;padding-top:12px}
  input[type=file]{display:none}
  @media (max-width:480px){
    header{padding:28px 0 32px}
    .info .n{max-width:150px}
  }
</style>
</head>
<body>

<header><h1>معاذ. K20SHOP x</h1></header>

<main>
  <div class="intro">
    <h2>فك ضغط الملفات</h2>
    <p>ارفع ملفك وحمّله بعد فك الضغط.</p>
  </div>

  <div class="row">
    <div class="fname">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>
      <span id="pickName" dir="auto">لم يتم اختيار ملف</span>
    </div>
    <button type="button" class="small" id="pickBtn">اختر ملف</button>
    <input type="file" id="fileInput" accept=".zip,.rar,.7z,application/zip,application/x-rar-compressed,application/vnd.rar,application/x-7z-compressed">
  </div>

  <button type="button" class="big" id="extractBtn" disabled>فك الضغط</button>

  <div class="card" aria-live="polite">
    <div class="top">
      <div class="state"><span id="stateText">لم يتم اختيار ملف</span><span id="stateIcon"></span></div>
      <div class="info" id="info" hidden><div class="n" id="infoName"></div><div class="s" id="infoSize"></div></div>
    </div>
    <hr>
    <div id="msg">اختر ملفًا للبدء.</div>
    <div id="detail" hidden></div>
    <ul id="list" hidden></ul>
  </div>

  <button type="button" class="big dl" id="dlBtn" disabled>
    <span>تحميل الملفات</span>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="M7 11l5 5 5-5"/><path d="M5 20h14"/></svg>
  </button>
</main>

<footer>
  <div>الصيغ المدعومة: ZIP - RAR - 7Z</div>
  <div>يتم فك الضغط ومعالجة الملفات محليًا في متصفحك</div>
</footer>

<!-- JSZip 3.10.1 (قراءة ZIP وإنشاء ملف ZIP الناتج) -->
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
  if (!window.JSZip) {
    document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"><\/script>');
  }
</script>

<!-- المنطق الأساسي (يعمل بدون واجهة، وتم اختباره) -->
<script id="core">
var Core = (function () {
  /* تنظيف المسار: يمنع ../ والمسارات المطلقة. يرجع null إذا كان المسار خطرًا */
  function safePath(p) {
    var parts = String(p).replace(/\\/g, "/").split("/").filter(function (x) { return x && x !== "."; });
    for (var i = 0; i < parts.length; i++) if (parts[i] === "..") return null;
    return parts.join("/");
  }

  /* كشف نوع الأرشيف من أول بايتات الملف (أدق من الامتداد) */
  function detect(u8, fallbackExt) {
    var b = u8;
    if (b.length >= 4 && b[0] === 0x50 && b[1] === 0x4B && (b[2] === 3 || b[2] === 5 || b[2] === 7)) return "zip";
    if (b.length >= 6 && b[0] === 0x52 && b[1] === 0x61 && b[2] === 0x72 && b[3] === 0x21 && b[4] === 0x1A && b[5] === 0x07) return "rar";
    if (b.length >= 6 && b[0] === 0x37 && b[1] === 0x7A && b[2] === 0xBC && b[3] === 0xAF && b[4] === 0x27 && b[5] === 0x1C) return "7z";
    return fallbackExt || "";
  }

  /* أسماء ZIP: UTF-8 أولًا، وإن فشل فـ windows-1256 (عربي قديم) */
  function decodeName(bytes) {
    try { return new TextDecoder("utf-8", { fatal: true }).decode(bytes); }
    catch (e) {
      try { return new TextDecoder("windows-1256").decode(bytes); }
      catch (e2) { return new TextDecoder("utf-8").decode(bytes); }
    }
  }

  /* يقرأ ZIP فعليًا ويُدخل كل ملف مستخرج في كائن ZIP جديد (out) */
  async function zipToZip(buf, JSZipLib) {
    var src = await JSZipLib.loadAsync(buf, { decodeFileName: decodeName });
    var out = new JSZipLib();
    var names = [], skipped = 0, entries = [];
    src.forEach(function (rel, e) { entries.push([rel, e]); });
    for (var i = 0; i < entries.length; i++) {
      var rel = entries[i][0], e = entries[i][1];
      var sp = safePath(rel);
      if (sp === null) { skipped++; continue; }
      if (sp === "") continue;
      if (e.dir) { out.folder(sp); continue; }
      var data = await e.async("uint8array");
      out.file(sp, data, { binary: true, date: e.date });
      names.push(sp);
    }
    return { out: out, names: names, skipped: skipped };
  }

  /* ينشئ ZIP النهائي ثم يعيد فتحه للتحقق من أن محتواه هو الملفات المستخرجة */
  async function finalize(out, JSZipLib, expectedNames, type, onProgress) {
    var result = await out.generateAsync(
      { type: type || "blob", compression: "DEFLATE", compressionOptions: { level: 1 }, streamFiles: true },
      function (m) { if (onProgress) onProgress(m.percent); }
    );
    var ab = result.arrayBuffer ? await result.arrayBuffer() : result;
    var chk = await JSZipLib.loadAsync(ab);
    var got = [];
    chk.forEach(function (rel, e) { if (!e.dir) got.push(rel); });
    if (got.length !== expectedNames.length) throw new Error("verify: count mismatch " + got.length + "/" + expectedNames.length);
    expectedNames.forEach(function (n) { if (got.indexOf(n) < 0) throw new Error("verify: missing " + n); });
    return result;
  }

  return { safePath: safePath, detect: detect, decodeName: decodeName, zipToZip: zipToZip, finalize: finalize };
})();
</script>

<script type="module">
/* 7-Zip WASM 1.2.0 — يُستخدم لـ RAR و 7Z فقط (ZIP يُفك بـ JSZip مباشرة) */
const SZ_BASE = "https://cdn.jsdelivr.net/npm/7z-wasm@1.2.0/";
const MAX_BYTES = 400 * 1024 * 1024; // حد متحفظ بسبب ذاكرة Safari

const $ = (id) => document.getElementById(id);
const fileInput = $("fileInput"), pickBtn = $("pickBtn"), extractBtn = $("extractBtn"), dlBtn = $("dlBtn");
const pickName = $("pickName"), stateText = $("stateText"), stateIcon = $("stateIcon");
const info = $("info"), infoName = $("infoName"), infoSize = $("infoSize"), msg = $("msg");
const detail = $("detail"), list = $("list");

const ICON_OK = '<svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#000"/><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ICON_ERR = '<svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#000"/><path d="M8 8l8 8M16 8l-8 8" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>';

let file = null, resultUrl = null, resultName = "files-extracted.zip", busy = false;

class UserError extends Error {}

function fmtSize(b){
  if (b < 1024) return b + " B";
  if (b < 1048576) return (b/1024).toFixed(1) + " KB";
  if (b < 1073741824) return (b/1048576).toFixed(1) + " MB";
  return (b/1073741824).toFixed(2) + " GB";
}
function ext(name){ const m = /\.([^.]+)$/.exec(name); return m ? m[1].toLowerCase() : ""; }
function setState(title, icon, message, det){
  stateText.textContent = title;
  stateIcon.innerHTML = icon || "";
  msg.textContent = message;
  detail.hidden = !det; detail.textContent = det || "";
}
function showList(names){
  list.innerHTML = "";
  if (!names || !names.length) { list.hidden = true; return; }
  names.slice(0, 8).forEach(n => { const li = document.createElement("li"); li.textContent = n; list.appendChild(li); });
  if (names.length > 8) { const li = document.createElement("li"); li.className = "more"; li.textContent = "… +" + (names.length - 8); list.appendChild(li); }
  list.hidden = false;
}
function resetResult(){
  if (resultUrl) { URL.revokeObjectURL(resultUrl); resultUrl = null; }
  dlBtn.disabled = true; showList(null);
}

pickBtn.addEventListener("click", () => { if (!busy) fileInput.click(); });

fileInput.addEventListener("change", () => {
  resetResult();
  const f = fileInput.files && fileInput.files[0];
  if (!f) return;
  file = null; extractBtn.disabled = true;
  pickName.textContent = f.name + " (" + fmtSize(f.size) + ")";
  info.hidden = false; infoName.textContent = f.name; infoSize.textContent = fmtSize(f.size);
  if (!["zip","rar","7z"].includes(ext(f.name))) {
    setState("تعذر فك الضغط", ICON_ERR, "صيغة غير مدعومة. الصيغ المدعومة: ZIP و RAR و 7Z.");
    return;
  }
  if (f.size > MAX_BYTES) {
    setState("تعذر فك الضغط", ICON_ERR, "الملف كبير جدًا (الحد الأقصى " + fmtSize(MAX_BYTES) + ") بسبب محدودية ذاكرة المتصفح.");
    return;
  }
  file = f; extractBtn.disabled = false;
  setState("تم اختيار الملف بنجاح", ICON_OK, "اضغط على زر \"فك الضغط\" لبدء العملية.");
});

function walk(FS, dir, rel, files, dirs){
  for (const n of FS.readdir(dir)) {
    if (n === "." || n === "..") continue;
    const p = dir + "/" + n;
    const st = FS.lstat(p);
    if (FS.isLink(st.mode)) continue;
    if (FS.isDir(st.mode)) { dirs.push(rel + n); walk(FS, p, rel + n + "/", files, dirs); }
    else if (FS.isFile(st.mode)) files.push([p, rel + n]);
  }
}

/* RAR / 7Z عبر 7-Zip WASM: يستخرج إلى ذاكرة WASM ثم يُنقل إلى ZIP جديد */
async function wasmToZip(buf){
  let SevenZip;
  try { SevenZip = (await import(SZ_BASE + "7zz.es6.js")).default; }
  catch (e) { throw new UserError("تعذر تحميل مكتبة فك RAR/7Z. تحقق من اتصال الإنترنت ثم أعد تحميل الصفحة. (ZIP يعمل بدونها)"); }

  const logs = [];
  const sz = await SevenZip({
    locateFile: (f) => SZ_BASE + f,
    print: (t) => logs.push(String(t)),
    printErr: (t) => logs.push(String(t)),
  });
  const FS = sz.FS;
  const inName = "input.bin";
  const stream = FS.open(inName, "w+");
  FS.write(stream, buf, 0, buf.length);
  FS.close(stream);

  FS.mkdir("/out");
  let code = 0;
  try {
    const r = sz.callMain(["x", inName, "-o/out", "-y", "-aoa", "-pnopassword"]);
    code = typeof r === "number" ? r : 0;
  } catch (e) {
    code = (e && typeof e.status === "number") ? e.status : 255;
  }
  try { FS.unlink(inName); } catch (_) {}

  const all = logs.join("\n");
  if (code >= 2) {
    if (/wrong password|encrypted/i.test(all)) throw new UserError("الملف محمي بكلمة مرور، وهذا غير مدعوم حاليًا.");
    throw new UserError("تعذر فك الضغط، تأكد من سلامة الملف.");
  }

  const files = [], dirs = [];
  walk(FS, "/out", "", files, dirs);
  const out = new JSZip(), names = []; let skipped = 0;
  for (const d of dirs) { const sp = Core.safePath(d); if (sp) out.folder(sp); }
  for (const [real, rel] of files) {
    const sp = Core.safePath(rel);
    if (!sp) { skipped++; continue; }
    out.file(sp, FS.readFile(real), { binary: true });
    names.push(sp);
    try { FS.unlink(real); } catch (_) {}
  }
  return { out, names, skipped, warn: code === 1 };
}

extractBtn.addEventListener("click", async () => {
  if (!file || busy) return;
  busy = true; resetResult();
  extractBtn.disabled = true; pickBtn.disabled = true;
  setState("جارٍ فك الضغط…", "", "جارٍ فك الضغط…");
  try {
    if (!window.JSZip) throw new UserError("تعذر تحميل مكتبة JSZip. تحقق من اتصال الإنترنت ثم أعد تحميل الصفحة.");

    let buf = new Uint8Array(await file.arrayBuffer());
    const kind = Core.detect(buf, ext(file.name));
    let res;
    if (kind === "zip") {
      try { res = await Core.zipToZip(buf, JSZip); }
      catch (e) {
        if (e instanceof UserError) throw e;
        throw new UserError("تعذر فك الضغط، تأكد من سلامة الملف.");
      }
    } else if (kind === "rar" || kind === "7z") {
      res = await wasmToZip(buf);
    } else {
      throw new UserError("صيغة غير مدعومة. الصيغ المدعومة: ZIP و RAR و 7Z.");
    }
    buf = null;

    if (!res.names.length) throw new UserError("لا توجد ملفات داخل الأرشيف، أو أن الملف غير صالح.");

    msg.textContent = "جارٍ إنشاء ملف ZIP…";
    const blob = await Core.finalize(res.out, JSZip, res.names, "blob", (p) => {
      msg.textContent = "جارٍ إنشاء ملف ZIP… " + Math.round(p) + "%";
    });

    resultUrl = URL.createObjectURL(blob);
    resultName = file.name.replace(/\.[^.]+$/, "") + "-extracted.zip";
    dlBtn.disabled = false; // لا يُفعَّل إلا بعد اكتمال إنشاء وفحص ZIP الناتج
    let note = "اكتمل فك الضغط بنجاح. عدد الملفات: " + res.names.length + " — حجم ZIP الناتج: " + fmtSize(blob.size);
    if (res.warn) note += " (مع تحذيرات من الأرشيف)";
    if (res.skipped) note += " — تم تجاهل " + res.skipped + " مسار غير آمن";
    setState("اكتمل فك الضغط بنجاح", ICON_OK, note);
    showList(res.names);
  } catch (e) {
    console.error(e);
    resetResult();
    if (e instanceof UserError) setState("تعذر فك الضغط", ICON_ERR, e.message);
    else if (e instanceof RangeError || /memory|alloc/i.test(String(e && e.message)))
      setState("تعذر فك الضغط", ICON_ERR, "الذاكرة غير كافية لمعالجة هذا الملف.", String(e && e.message));
    else setState("تعذر فك الضغط", ICON_ERR, "تعذر فك الضغط، تأكد من سلامة الملف.", String(e && e.message));
  } finally {
    busy = false; pickBtn.disabled = false; extractBtn.disabled = !file;
  }
});

dlBtn.addEventListener("click", () => {
  if (!resultUrl) return;
  const a = document.createElement("a");
  a.href = resultUrl; a.download = resultName;
  document.body.appendChild(a); a.click(); a.remove();
});
</script>
</body>
</html>
