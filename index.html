<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>معاذ. K20SHOP x</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:#fff;color:#000;
    font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;
    padding:max(env(safe-area-inset-top),24px) 20px max(env(safe-area-inset-bottom),24px);
    line-height:1.6;
  }
  header{width:100%;text-align:center;padding:48px 0 56px}
  header h1{font-size:clamp(28px,6vw,44px);font-weight:700;letter-spacing:.5px}
  main{width:100%;max-width:680px;flex:1;display:flex;flex-direction:column;justify-content:center;gap:20px;padding-bottom:32px}
  .intro{text-align:center;margin-bottom:12px}
  .intro h2{font-size:clamp(24px,5vw,34px);font-weight:700}
  .intro p{font-size:clamp(15px,3.4vw,18px);color:#333;margin-top:6px}

  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid #000;border-radius:2px;padding:10px 12px;min-height:64px}
  .row .fname{display:flex;align-items:center;gap:10px;min-width:0;flex:1;font-size:15px;color:#000}
  .row .fname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row svg{flex:none}

  button{font-family:inherit;font-size:16px;font-weight:700;border:0;border-radius:2px;cursor:pointer;background:#000;color:#fff;-webkit-appearance:none;appearance:none;touch-action:manipulation}
  .small{padding:12px 20px;flex:none}
  .big{width:100%;padding:16px;min-height:54px}
  button:disabled{background:#ddd;color:#888;cursor:not-allowed}
  button:focus-visible,input:focus-visible{outline:2px solid #000;outline-offset:2px}

  .card{border:1px solid #000;border-radius:2px;padding:16px 18px}
  .card .top{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .state{display:flex;align-items:center;gap:10px;font-size:14px}
  .info{text-align:left;direction:ltr;min-width:0}
  .info .n{font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px}
  .info .s{font-size:14px;color:#333}
  .card hr{border:0;border-top:1px solid #ccc;margin:14px 0}
  #msg{text-align:center;font-size:14px;color:#222;min-height:22px;word-break:break-word}

  .dl{display:flex;align-items:center;justify-content:center;gap:10px}
  footer{width:100%;max-width:680px;text-align:center;font-size:13px;color:#777;padding-top:12px}
  input[type=file]{display:none}
  @media (max-width:480px){
    header{padding:28px 0 32px}
    .info .n{max-width:150px}
  }
</style>
</head>
<body>

<header><h1>معاذ. K20SHOP x</h1></header>

<main>
  <div class="intro">
    <h2>فك ضغط الملفات</h2>
    <p>ارفع ملفك وحمّله بعد فك الضغط.</p>
  </div>

  <div class="row">
    <div class="fname">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>
      <span id="pickName" dir="auto">لم يتم اختيار ملف</span>
    </div>
    <button type="button" class="small" id="pickBtn">اختر ملف</button>
    <input type="file" id="fileInput" accept=".zip,.rar,.7z,application/zip,application/x-rar-compressed,application/vnd.rar,application/x-7z-compressed">
  </div>

  <button type="button" class="big" id="extractBtn" disabled>فك الضغط</button>

  <div class="card" aria-live="polite">
    <div class="top">
      <div class="state"><span id="stateText">لم يتم اختيار ملف</span><span id="stateIcon"></span></div>
      <div class="info" id="info" hidden><div class="n" id="infoName"></div><div class="s" id="infoSize"></div></div>
    </div>
    <hr>
    <div id="msg">اختر ملفًا للبدء.</div>
  </div>

  <button type="button" class="big dl" id="dlBtn" disabled>
    <span>تحميل الملفات</span>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="M7 11l5 5 5-5"/><path d="M5 20h14"/></svg>
  </button>
</main>

<footer>
  <div>الصيغ المدعومة: ZIP - RAR - 7Z</div>
  <div>يتم فك الضغط ومعالجة الملفات محليًا في متصفحك</div>
</footer>

<!-- JSZip 3.10.1 (إنشاء ملف ZIP الناتج) -->
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
  if (!window.JSZip) {
    document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"><\/script>');
  }
</script>

<script type="module">
/* 7-Zip WASM 1.2.0 (يدعم ZIP و RAR و 7Z) — يعمل بالكامل داخل المتصفح */
const SZ_BASE = "https://cdn.jsdelivr.net/npm/7z-wasm@1.2.0/";
const MAX_BYTES = 400 * 1024 * 1024; // حد متحفظ بسبب ذاكرة Safari

const $ = (id) => document.getElementById(id);
const fileInput = $("fileInput"), pickBtn = $("pickBtn"), extractBtn = $("extractBtn"), dlBtn = $("dlBtn");
const pickName = $("pickName"), stateText = $("stateText"), stateIcon = $("stateIcon");
const info = $("info"), infoName = $("infoName"), infoSize = $("infoSize"), msg = $("msg");

const ICON_OK = '<svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#000"/><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ICON_ERR = '<svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#000"/><path d="M8 8l8 8M16 8l-8 8" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>';

let file = null, resultBlob = null, resultUrl = null, busy = false;

function fmtSize(b){
  if (b < 1024) return b + " B";
  if (b < 1048576) return (b/1024).toFixed(1) + " KB";
  if (b < 1073741824) return (b/1048576).toFixed(1) + " MB";
  return (b/1073741824).toFixed(2) + " GB";
}
function setState(title, icon, message){
  stateText.textContent = title;
  stateIcon.innerHTML = icon || "";
  msg.textContent = message;
}
function resetResult(){
  resultBlob = null;
  if (resultUrl) { URL.revokeObjectURL(resultUrl); resultUrl = null; }
  dlBtn.disabled = true;
}
function ext(name){ const m = /\.([^.]+)$/.exec(name); return m ? m[1].toLowerCase() : ""; }

pickBtn.addEventListener("click", () => { if (!busy) fileInput.click(); });

fileInput.addEventListener("change", () => {
  resetResult();
  const f = fileInput.files && fileInput.files[0];
  if (!f) return;
  file = null; extractBtn.disabled = true;
  pickName.textContent = f.name + " (" + fmtSize(f.size) + ")";
  info.hidden = false; infoName.textContent = f.name; infoSize.textContent = fmtSize(f.size);
  if (!["zip","rar","7z"].includes(ext(f.name))) {
    setState("تعذر فك الضغط", ICON_ERR, "صيغة غير مدعومة. الصيغ المدعومة: ZIP و RAR و 7Z.");
    return;
  }
  if (f.size > MAX_BYTES) {
    setState("تعذر فك الضغط", ICON_ERR, "الملف كبير جدًا (الحد الأقصى " + fmtSize(MAX_BYTES) + ") بسبب محدودية ذاكرة المتصفح.");
    return;
  }
  file = f; extractBtn.disabled = false;
  setState("تم اختيار الملف بنجاح", ICON_OK, "اضغط على زر \"فك الضغط\" لبدء العملية.");
});

/* تنظيف المسار: يمنع ../ والمسارات المطلقة */
function safePath(p){
  const parts = p.replace(/\\/g, "/").split("/").filter(s => s && s !== ".");
  if (parts.some(s => s === "..")) return null;
  return parts.join("/");
}

function walk(FS, dir, rel, files, dirs){
  for (const n of FS.readdir(dir)) {
    if (n === "." || n === "..") continue;
    const p = dir + "/" + n;
    const st = FS.lstat(p);
    if (FS.isLink(st.mode)) continue;
    if (FS.isDir(st.mode)) { dirs.push(rel + n); walk(FS, p, rel + n + "/", files, dirs); }
    else if (FS.isFile(st.mode)) files.push([p, rel + n]);
  }
}

class UserError extends Error {}

extractBtn.addEventListener("click", async () => {
  if (!file || busy) return;
  busy = true; resetResult();
  extractBtn.disabled = true; pickBtn.disabled = true;
  setState("جارٍ فك الضغط…", "", "جارٍ فك الضغط…");
  try {
    if (!window.JSZip) throw new UserError("تعذر تحميل مكتبة إنشاء ZIP. تحقق من اتصال الإنترنت ثم أعد تحميل الصفحة.");

    let SevenZip;
    try {
      SevenZip = (await import(SZ_BASE + "7zz.es6.js")).default;
    } catch (e) {
      throw new UserError("تعذر تحميل مكتبة فك الضغط. تحقق من اتصال الإنترنت ثم أعد تحميل الصفحة.");
    }

    const logs = [];
    const sz = await SevenZip({
      locateFile: (f) => SZ_BASE + f,
      print: (t) => logs.push(String(t)),
      printErr: (t) => logs.push(String(t)),
    });
    const FS = sz.FS;

    // نسخ الأرشيف إلى ذاكرة WASM باسم آمن (لتجنب مشاكل الأسماء العربية في الإدخال)
    const inName = "input." + ext(file.name);
    let buf = new Uint8Array(await file.arrayBuffer());
    const stream = FS.open(inName, "w+");
    FS.write(stream, buf, 0, buf.length);
    FS.close(stream);
    buf = null;

    FS.mkdir("/out");
    let code = 0;
    try {
      const r = sz.callMain(["x", inName, "-o/out", "-y", "-aoa", "-pnopassword"]);
      code = typeof r === "number" ? r : 0;
    } catch (e) {
      code = (e && typeof e.status === "number") ? e.status : 255;
    }
    try { FS.unlink(inName); } catch (_) {}

    const all = logs.join("\n");
    if (code >= 2) {
      if (/wrong password|encrypted|password/i.test(all)) throw new UserError("الملف محمي بكلمة مرور، وهذا غير مدعوم حاليًا.");
      throw new UserError("تعذر فك الضغط، تأكد من سلامة الملف.");
    }

    const files = [], dirs = [];
    walk(FS, "/out", "", files, dirs);
    if (!files.length && !dirs.length) throw new UserError("تعذر فك الضغط، تأكد من سلامة الملف أو أن الأرشيف غير فارغ.");

    const zip = new JSZip();
    let count = 0, skipped = 0;
    for (const d of dirs) { const sp = safePath(d); if (sp) zip.folder(sp); }
    for (const [real, rel] of files) {
      const sp = safePath(rel);
      if (!sp) { skipped++; continue; }
      zip.file(sp, FS.readFile(real), { binary: true });
      try { FS.unlink(real); } catch (_) {} // تحرير الذاكرة تدريجيًا
      count++;
    }
    if (!count) throw new UserError("لا توجد ملفات صالحة للاستخراج.");

    const blob = await zip.generateAsync(
      { type: "blob", compression: "DEFLATE", compressionOptions: { level: 1 }, streamFiles: true },
      (m) => { msg.textContent = "جارٍ إنشاء ملف ZIP… " + Math.round(m.percent) + "%"; }
    );

    resultBlob = blob;
    resultUrl = URL.createObjectURL(blob);
    dlBtn.disabled = false; // التنزيل لا يبدأ إلا بضغطة المستخدم بعد اكتمال الإنشاء
    let note = "اكتمل فك الضغط بنجاح. عدد الملفات: " + count + " — حجم ZIP: " + fmtSize(blob.size);
    if (code === 1) note += " (مع تحذيرات من الأرشيف)";
    if (skipped) note += " — تم تجاهل " + skipped + " مسار غير آمن";
    setState("اكتمل فك الضغط بنجاح", ICON_OK, note);
  } catch (e) {
    console.error(e);
    resetResult();
    const text = e instanceof UserError ? e.message
      : (e instanceof RangeError || /memory|alloc/i.test(String(e && e.message))) ? "الذاكرة غير كافية لمعالجة هذا الملف."
      : "تعذر فك الضغط، تأكد من سلامة الملف.";
    setState("تعذر فك الضغط", ICON_ERR, text);
  } finally {
    busy = false; pickBtn.disabled = false; extractBtn.disabled = !file;
  }
});

dlBtn.addEventListener("click", () => {
  if (!resultUrl) return;
  const base = file ? file.name.replace(/\.[^.]+$/, "") : "files";
  const a = document.createElement("a");
  a.href = resultUrl; a.download = base + "-extracted.zip";
  document.body.appendChild(a); a.click(); a.remove();
});
</script>
</body>
</html>
